commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3Version" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commonsCodecVersion" }
commons-collections = { module = "org.apache.commons:commons-collections4", version.ref = "commonsCollectionsVersion" }
commons-io = { module = "commons-io:commons-io", version.ref = "commonsIoVersion" }
commons-pool2 = { module = "org.apache.commons:commons-pool2", version.ref = "commonsPool2Version" }
elasticsearch = { module = "org.elasticsearch:elasticsearch", version.ref = "elasticsearchVersion" }
elasticsearch-rest-client = { module = "org.elasticsearch.client:elasticsearch-rest-client", version.ref = "elasticsearchVersion" }
elasticsearch-test = { module = "org.elasticsearch.test:framework", version.ref = "elasticsearchVersion" }
guava = { module = "com.google.guava:guava", version.ref = "guavaVersion" }
httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "httpComponentsVersion" }
