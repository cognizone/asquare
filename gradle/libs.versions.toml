spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "springBootVersion" }
spring-security-core = { module = "org.springframework.security:spring-security-core", version.ref = "springSecurityVersion" }
spring-security-test = { module = "org.springframework.security:spring-security-test", version.ref = "springSecurityVersion" }
vavr = { module = "io.vavr:vavr", version.ref = "vavrVersion" }

[plugins]
axion-release = { id = "pl.allegro.tech.build.axion-release", version = "1.18.18" }
idea = { id = "idea" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBootVersion" }
java = { id = "java" }
maven-publish = { id = "maven-publish" }
dependency-check = { id = "org.owasp.dependencycheck", version = "7.4.4" }
