cglibVersion = "3.3.0"
commonsLang3Version = '3.17.0'
commonsCodecVersion = '1.18.0'
commonsCollectionsVersion = "4.5.0"
commonsIoVersion = '2.19.0'
commonsPool2Version = "2.12.1"
elasticsearchVersion = '7.5.2'
guavaVersion = '33.4.8-jre'
httpclient5Version = "5.5"
httpComponentsVersion = '4.5.14'
jacksonVersion = "2.19.1"
jakartaInjectVersion = "2.0.1"
jenaVersion = '5.4.0'
jodaTimeVersion = "2.14.0"
jsonldJavaVersion= '0.13.2'
