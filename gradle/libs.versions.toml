[versions]
apachePoiVersion = '5.5.1'
commonsLang3Version = '3.19.0'           # SB4 managed version (was 3.20.0)
commonsCodecVersion = '1.21.0'           # SB4 managed version, unchanged
commonsCollectionsVersion = "4.5.0"      # not managed by SB4, unchanged
commonsIoVersion = '2.21.0'             # not managed by SB4, unchanged
commonsPool2Version = "2.13.1"           # SB4 managed version, unchanged
elasticsearchVersion = '7.5.2'           # pinned: Apache 2.0 license, intentionally kept for asquareroot test infra
guavaVersion = '33.5.0-jre'             # not managed by SB4, latest stable
httpclient5Version = "5.6"              # not managed by SB4, latest stable
httpComponentsVersion = '4.5.14'        # not managed by SB4, latest stable (httpclient 4.x)
jakartaInjectVersion = "2.0.1"          # Jakarta EE 11 compatible
jenaVersion = '5.6.0'                   # not managed by SB4, latest stable
jodaTimeVersion = "2.14.1"             # latest stable (was 2.14.0)
jsonldJavaVersion = '0.13.6'            # not managed by SB4, latest stable
junitVersion = "6.0.3"                  # SB4 ships JUnit Jupiter 6.0.x (was 5.14.3)
lombokVersion = "1.18.42"              # not managed by SB4, latest stable
ognlVersion = "3.3.4"                   # not managed by SB4, latest stable
snakeyaml = "2.5"                       # SB4 managed version (was 2.6)
springBootVersion = '4.0.2'             # upgraded from 3.5.11
springSecurityVersion = '7.0.3'         # SB4 managed Spring Security 7 (was 6.5.8)
vavrVersion = "0.10.6"                  # latest stable in 0.10.x line (was 0.10.7 — does not exist, latest is 0.10.6)

[libraries]
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3Version" }
commons-codec = { module = "commons-codec:commons-codec", version.ref = "commonsCodecVersion" }
commons-collections = { module = "org.apache.commons:commons-collections4", version.ref = "commonsCollectionsVersion" }
commons-io = { module = "commons-io:commons-io", version.ref = "commonsIoVersion" }
commons-pool2 = { module = "org.apache.commons:commons-pool2", version.ref = "commonsPool2Version" }
elasticsearch = { module = "org.elasticsearch:elasticsearch", version.ref = "elasticsearchVersion" }
elasticsearch-rest-client = { module = "org.elasticsearch.client:elasticsearch-rest-client", version.ref = "elasticsearchVersion" }
elasticsearch-test = { module = "org.elasticsearch.test:framework", version.ref = "elasticsearchVersion" }
guava = { module = "com.google.guava:guava", version.ref = "guavaVersion" }
httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "httpComponentsVersion" }
httpclient-fluent = { module = "org.apache.httpcomponents:fluent-hc", version.ref = "httpComponentsVersion" }
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5Version" }
jakarta-inject = { module = "jakarta.inject:jakarta.inject-api", version.ref = "jakartaInjectVersion" }
jena-core = { module = "org.apache.jena:jena-core", version.ref = "jenaVersion" }
jena-arq = { module = "org.apache.jena:jena-arq", version.ref = "jenaVersion" }
jena-tdb1 = { module = "org.apache.jena:jena-tdb1", version.ref = "jenaVersion" }
jena-tdb2 = { module = "org.apache.jena:jena-tdb2", version.ref = "jenaVersion" }
jena-shacl = { module = "org.apache.jena:jena-shacl", version.ref = "jenaVersion" }
jena-rdfconnection = { module = "org.apache.jena:jena-rdfconnection", version.ref = "jenaVersion" }
jena-fuseki-main = { module = "org.apache.jena:jena-fuseki-main", version.ref = "jenaVersion" }
joda-time = { module = "joda-time:joda-time", version.ref = "jodaTimeVersion" }
jsonld-java = { module = "com.github.jsonld-java:jsonld-java", version.ref = "jsonldJavaVersion" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junitVersion" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junitVersion" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junitVersion" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }  # version managed by junit-bom
lombok = { module = "org.projectlombok:lombok", version.ref = "lombokVersion" }
ognl = { module = "ognl:ognl", version.ref = "ognlVersion" }
poi = { module = "org.apache.poi:poi", version.ref = "apachePoiVersion" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "apachePoiVersion" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "springBootVersion" }
spring-boot-starter-aop = { module = "org.springframework.boot:spring-boot-starter-aspectj", version.ref = "springBootVersion" }  # renamed in SB4
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBootVersion" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBootVersion" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test", version.ref = "springBootVersion" }
spring-boot-starter-thymeleaf = { module = "org.springframework.boot:spring-boot-starter-thymeleaf", version.ref = "springBootVersion" }
spring-boot-starter-json = { module = "org.springframework.boot:spring-boot-starter-json", version.ref = "springBootVersion" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "springBootVersion" }
spring-security-core = { module = "org.springframework.security:spring-security-core", version.ref = "springSecurityVersion" }
spring-security-test = { module = "org.springframework.security:spring-security-test", version.ref = "springSecurityVersion" }
vavr = { module = "io.vavr:vavr", version.ref = "vavrVersion" }

[plugins]
axion-release = { id = "pl.allegro.tech.build.axion-release", version = "1.21.1" }
idea = { id = "idea" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBootVersion" }
java = { id = "java" }
maven-publish = { id = "maven-publish" }
dependency-check = { id = "org.owasp.dependencycheck", version = "12.2.0" }
